services:
  orquestador:
    build: .
    image: nexo/orquestador:latest
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - NEXO_ENV=production
      - NEXO_API_TOKEN=${NEXO_API_TOKEN:-}
      - OLLAMA_HOST=http://ollama-provider:11434
      - NEXO_DB_PATH=/data/nexo_data.db
      - NEXO_MEMORY_PATH=/data/nexo_data_db
    volumes:
      - nexo-data:/data
    depends_on:
      ollama-provider:
        condition: service_healthy
    networks:
      - nexo-network

  ollama-provider:
    image: ollama/ollama:latest
    networks:
      - nexo-network
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  nexo-network:
    driver: bridge

volumes:
  nexo-data:
  ollama-data:
